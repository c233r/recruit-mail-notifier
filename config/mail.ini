; ============================================================
; 招聘邮件通知系统 —— 邮件配置 (mail.ini)
; ============================================================
; 本文件只放「非敏感的邮件设置」。账号密码一律不写在这里，
; 只写环境变量的名字（*_env 字段），真实值放系统环境变量
; 或项目根目录的 .env 文件里。
;
; 程序每轮定时任务开始前都会重新读取本文件（热加载），
; 所以你改完保存即可生效，不需要重启服务。
; 但「环境变量」的改动需要重启进程才会被读到。
; ============================================================

[imap]
; ---------- 收信：读取待识别的招聘邮件 ----------
enabled = true
host = imap.qq.com
port = 993
use_ssl = true
; 登录账号。直接填在这里也可以，留空则从 user_env 指向的环境变量读取
username =
user_env = RECRUIT_IMAP_USER
; 密码/授权码所在的环境变量名
; 注意：QQ、163 等邮箱这里要填的是「IMAP 授权码」，不是网页登录密码
password_env = RECRUIT_IMAP_PASSWORD
; 监听的文件夹
mailbox = INBOX
; 只处理收件人是这些地址的邮件，多个用英文逗号分隔；留空 = 不限制
recipient_aliases =
; 首次运行（还没有游标）时只回看最近 N 天，避免全量拉取历史邮件
initial_lookback_days = 30
; 单次轮询最多拉取多少封
fetch_batch_size = 0
; 网络超时（秒）
timeout_seconds = 30
; 只读模式：永不标记已读、永不删除、永不移动
readonly = true
; 增量拉取方式：
;   uid   按「上次处理到的 UID」往后拉（推荐，最精确，不会重复下载）
;   since 按「上次运行的时间点」往后拉。IMAP 的 SINCE 只精确到天，
;         会多下载当天已看过的邮件，靠 Message-ID 去重；
;         适合你手动删过数据库、想按时间重新捞的场景
fetch_mode = uid

; ---------- 归档文件夹 ----------
; 把识别出的面试/笔试通知「复制」一份到这个文件夹，方便集中查看：
; 收件箱里什么都有，这个文件夹里只有跟你求职相关的通知。
;
; 开启后的影响：
;   * 用 IMAP COPY，原邮件仍留在收件箱，只是多一份副本
;   * COPY 命令不允许作用在只读打开的邮箱上，所以程序会临时用读写方式打开；
;     但取信一律用 BODY.PEEK[]，所以【不会】把你的邮件标成已读
;   * 文件夹不存在会自动创建
; 留空 = 不归档（程序对邮箱严格只读）。想开启就填文件夹名，例：archive_folder =
archive_folder =
; 邮件链接模板，用于在汇总里给出「点开原邮件」的地址。
; 可用占位符：{account} {mailbox} {uid} {message_id} {subject} {from_addr} {date}
; 留空则退化为 mid:<message-id> 形式的标识（不可点击，只用于区分邮件）。
;
; ---- 各邮箱的现成写法（把不需要的部分删掉，只留一行）----
;   Gmail    按 Message-ID 精确打开：
;     https://mail.google.com/mail/u/0/#search/rfc822msgid:{message_id}
;   Outlook  按 Message-ID 搜索：
;     https://outlook.live.com/mail/0/search?q={message_id}
;   通用兜底 按发件人搜索（几乎所有网页邮箱都支持这类搜索页）：
;     https://mail.google.com/mail/u/0/#search/from%3A{from_addr}
;
; ---- 关于 QQ 邮箱 ----
; QQ 邮箱网页版打开某封邮件用的是
;   https://mail.qq.com/cgi-bin/...?sid=<登录会话>&mailid=<服务端内部ID>
; sid 是你当前会话的、mailid 是服务端内部编号，IMAP 都拿不到，
; 所以这里给不出稳定可点的写法，只能保持留空。
; 如果你在浏览器地址栏里发现了稳定格式，填到这里即可。
webmail_url_template =

[smtp]
; ---------- 发信：发送每日汇总通知 ----------
enabled = true
host = smtp.qq.com
port = 465
use_ssl = true
username =
user_env = RECRUIT_SMTP_USER
password_env = RECRUIT_SMTP_PASSWORD
; 发件人地址，留空则用 username
from_addr =
; 发件人显示名
from_name = 招聘邮件助手
; 发送失败重试次数与退避间隔（秒）
max_retries = 3
retry_backoff_seconds = 60

[notify]
; ---------- 汇总与轮询策略 ----------
; 轮询新邮件间隔（分钟）—— 只在 `main.py run --watch` 常驻模式下生效
poll_interval_minutes = 10
; 每日汇总发送时刻（24 小时制 HH:MM）—— 只在 `main.py run --watch` 常驻模式下生效
daily_summary_time = 10:00
; 时区：决定「每天 10:00」按哪个时区算，以及邮件里日期怎么显示
timezone = Asia/Shanghai
; 汇总邮件收件人，多个用英文逗号分隔
recipients = your_account@qq.com
; 抄送，可留空
cc =
; 主题模板，可用占位符：{date} {count}
subject_template = 【招聘汇总】{date} 共 {count} 封待处理
; 一封汇总邮件里最多列出多少条，超出只报数量
max_items_per_summary = 50
; 当天没有新邮件时是否也发一封「今日无新通知」
send_when_empty = false
; 哪些类别算「相关邮件」，需要进汇总（逗号分隔）
categories = interview,written_test
; 是否把「待确认」的低置信度条目附在汇总邮件末尾（不会单独触发一次发送）
include_pending_review_in_summary = true

; ---------- 完成回复 & 每日续推 ----------
; 是否允许通过「回复汇总邮件」来标记已完成：把完成的公司名写在回复正文里即可
reply_completion_enabled = true
; 允许发来完成回复的地址，逗号分隔；留空 = 用 notify.recipients + smtp 账号
reply_allowed_senders =
; 已提醒过但还没完成的，是否每天继续推送（这就是「明天继续推未完成项」）
remind_unfinished_daily = true
; 汇总邮件里的排序：deadline 按截止时间由近到远（默认）；received 按收信时间
sort_by = deadline

; 完成回复支持两种写法：
;   #12 #15    按邮件里的编号精确标记（推荐 —— 同一家公司可能有多场笔试/面试，
;              按公司名标记会把它们一次性全部标掉）
;   科大讯飞    按公司名标记，会把这家公司【所有】未完成项一起标掉
; 另外写「全部完成」可以一次清空当前所有提醒。
; 发汇总之前先收一次信（强烈建议保持 true）
; 你很可能刚回复「某某公司 已完成」，不先收信就会拿着旧的未完成清单去汇总
poll_before_summary = true

; 只在「有变化」时推送（避免一天登录几次就收到几封一样的汇总）
; true  = 自上次推送以来既没有新的待通知邮件、也没有标记完成，就跳过发送
; false = 每次运行都发一封
push_only_when_changed = true

[retention]
; ---------- 邮件保留期 ----------
; 只处理最近 N 天内「到达」的邮件。这个过滤在 IMAP 服务器端完成（SEARCH SINCE），
; 更早的邮件根本不会被下载和解析 —— 电脑停机两个月再开机，
; 也不会把两个月前的积压邮件一次性拉进来。0 = 不限制（不推荐）
max_age_days = 30
; 启动时（以及每天一次）删除数据库里超过 N 天的旧记录。0 = 不清理
; 只删本地数据库记录，邮箱里的邮件一封都不会动
purge_after_days = 30
; 是否在服务启动时先清理一次
purge_on_start = true
; 清理时是否保留「还没通知过 / 还没人工确认」的记录（status 为 new 或 pending_review）。
; 默认 true：这类记录是你还没处理的待办，删掉就再也提醒不到了。
; 想连它们一起删：改成 false，或者用 `python main.py purge --force`
purge_keep_unnotified = true

[notify.webhook]
; ---------- 备用通知渠道（第一版保持关闭）----------
enabled = false
url =
; 签名密钥所在的环境变量名
secret_env = RECRUIT_WEBHOOK_SECRET
