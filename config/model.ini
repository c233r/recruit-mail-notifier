; ============================================================
; 招聘邮件通知系统 —— 分类模型配置 (model.ini)
; ============================================================
; 本文件只放「分类策略」和「模型连接参数」。
; API Key 不写在这里，只写环境变量名（api_key_env）。
;
; 程序每次分类前都会重新读取本文件（热加载），
; 你可以在「纯规则」「规则+模型」「纯模型」之间随时切换。
; ============================================================

[classifier]
; ---------- 总体策略 ----------
; llm_only        : 全部交给模型，规则完全不参与（推荐）
;                   模型按固定 JSON 返回系统需要的所有字段，见 llm_client.py 的提示词
; rules_then_llm  : 主题命中「笔试/测评/面试」直接判定，否则交给模型
; rules_only      : 只用人工规则，不调用模型（离线、零成本）
strategy = llm_only

; 规则置信度 >= 此值 -> 直接采信规则结果，不调用模型
rule_accept_confidence = 0.80
; 规则置信度 <  此值 -> 视为低置信度，转交模型（或直接标记待确认）
llm_trigger_confidence = 0.80
; 无论规则还是模型，最终置信度 < 此值 -> 标记为「待确认」，进人工复核队列
pending_review_confidence = 0.55
; 命中多个类别且分差小于此值时，视为有歧义，压低置信度
ambiguity_margin = 0.10
; 送模型前正文截断长度（字符）
max_body_chars = 6000

; 说明：下面这些只会影响 rules_only / rules_then_llm 两种策略。
; strategy = llm_only 时规则完全不参与，rule_scope 之类的设置会被忽略。

; ---------- 规则匹配范围（重点）----------
; subject       只看主题（推荐）
;               招聘通知的主题几乎一定写着「笔试 / 测评 / 面试」；
;               而正文里这些词大量出现在免责声明、公司介绍、别的公司名、退订说明里，
;               一起匹配会大量误判（实测把「宣讲会邀请」「投递成功回执」
;               「QQ邮箱防诈骗提醒」都判成了面试通知）。
; subject_body  主题 + 正文一起匹配（旧的宽松行为，误报多）
rule_scope = subject

; 主题命中后直接采信的置信度（高于 pending_review_confidence 即直接发送、不调用模型）
subject_match_confidence = 0.95

[model]
; ---------- 大模型连接参数 ----------
; 重要：rule_scope = subject 时，主题没命中「笔试/测评/面试」的邮件会全部交给模型判断。
; 如果这里是 false，这些邮件不会被推送，而是统一进「待确认」队列（宁可少推，不要误报）。
; 所以要真正用起来，需要把这里改成 true，并在 .env 里配好 RECRUIT_LLM_API_KEY。
enabled = true
; 兼容 OpenAI 接口风格的任何服务：deepseek / openai / 通义 / 本地 vLLM 等
provider = openai_compatible
base_url = https://api.deepseek.com/v1
model = deepseek-chat
; API Key 所在的环境变量名
api_key_env = RECRUIT_LLM_API_KEY
timeout_seconds = 60
max_retries = 2
; 分类要可复现，温度保持 0
temperature = 0.0
; llm_only 要返回 10 个字段的 JSON，太小会被截断
max_tokens = 800
; 是否要求模型返回严格 JSON（llm_only 依赖它，不要关）
response_format_json = true

; ---------- 成本与稳定性保护 ----------
; 每天最多调用多少次模型，0 = 不限制
daily_call_limit = 0
; 模型调用失败且重试耗尽后，是否降级为「待确认」
fallback_to_pending_review = true
